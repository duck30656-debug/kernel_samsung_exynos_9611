name: Build Kernel - Exynos 9611 (A51 / topser_cat_SN_A15)

on:
  workflow_dispatch:
  push:
    branches:
      - topser_cat_SN_A15

permissions:
  contents: write

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: mlm-studios/kernel_samsung_exynos_9611
          ref: topser_cat_SN_A15
          path: kernel_source
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt -y update
          sudo apt -y install bison flex libssl-dev python3 python-is-python3 bc cpio rsync zip unzip git curl

      - name: Cache WeebX Clang toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: kernel_source/toolchain
          key: weebx-clang-19.1.5-${{ runner.os }}

      - name: Download WeebX Clang 19.1.5
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        working-directory: kernel_source
        run: |
          set -e
          wget -q https://github.com/XSans0/WeebX-Clang/releases/download/WeebX-Clang-19.1.5-release/WeebX-Clang-19.1.5.tar.gz -O weebx-clang.tar.gz
          rm -rf toolchain
          mkdir -p toolchain
          tar -xf weebx-clang.tar.gz -C toolchain
          rm -f weebx-clang.tar.gz
          ls -la toolchain | head -n 20

      - name: Verify toolchain
        working-directory: kernel_source
        run: |
          test -x "toolchain/bin/clang" || { echo "::error::clang missing"; exit 1; }
          ./toolchain/bin/clang --version

      # ============================================================
      # 1) KernelSU-Next + SuSFS hooks (dev-susfs fork)
      # ============================================================
      - name: Setup KernelSU-Next (dev-susfs)
        working-directory: kernel_source
        run: |
          set -e
          rm -rf KernelSU KernelSU-Next

          BRANCH=""
          for candidate in dev-susfs next-susfs; do
            if git clone --depth=1 -b "$candidate" \
                 https://github.com/KimelaZPrjkt/KernelSU-Next-susfs.git KernelSU-Next 2>/dev/null; then
              if [ -f "KernelSU-Next/kernel/Makefile" ] && [ -f "KernelSU-Next/kernel/Kconfig" ]; then
                BRANCH="$candidate"; break
              fi
            fi
            rm -rf KernelSU-Next
          done
          test -n "$BRANCH" || { echo "::error::no usable branch"; exit 1; }
          echo "Using branch: $BRANCH"

          ln -sf KernelSU-Next KernelSU
          echo "kernel/ listing:"
          ls -la KernelSU-Next/kernel/ | head -n 40

      # ============================================================
      # 2) SuSFS kernel-side patches (simonpunk/susfs4ksu, kernel-4.14)
      # ============================================================
      - name: Fetch simonpunk/susfs4ksu (kernel-4.14)
        working-directory: kernel_source
        run: |
          set -e
          rm -rf susfs4ksu
          git clone --depth=1 -b kernel-4.14 \
            https://gitlab.com/simonpunk/susfs4ksu.git susfs4ksu

          echo "susfs4ksu/kernel_patches contents:"
          ls -la susfs4ksu/kernel_patches/ || true
          echo "fs/ folder:"
          ls -la susfs4ksu/kernel_patches/fs/ || true
          echo "include/linux/ folder:"
          ls -la susfs4ksu/kernel_patches/include/linux/ || true
          echo "KernelSU patch:"
          ls -la susfs4ksu/kernel_patches/KernelSU/ || true

      - name: Copy SuSFS files into kernel tree
        working-directory: kernel_source
        run: |
          set -e
          SRC="susfs4ksu/kernel_patches"

          # ملفات الكيرنل الرئيسية
          cp "$SRC/fs/susfs.c" fs/susfs.c
          cp "$SRC/include/linux/susfs.h" include/linux/susfs.h

          # نسخ إضافية احتياطية لو موجودة
          [ -f "$SRC/include/linux/susfs_def.h" ] && cp "$SRC/include/linux/susfs_def.h" include/linux/susfs_def.h || true
          [ -d "$SRC/fs" ] && find "$SRC/fs" -type f -exec cp {} fs/ \; || true

          echo "✅ SuSFS kernel files copied:"
          ls -la fs/susfs.c include/linux/susfs.h

      - name: Apply KernelSu-side SuSFS patch (if any)
        working-directory: kernel_source
        run: |
          set +e
          P="$PWD/susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch"
          if [ -f "$P" ]; then
            cd KernelSU-Next
            patch -p1 --forward < "$P" && echo "✅ KernelSU patch applied" || echo "::warning::KernelSU patch had rejects (check .rej)"
            cd ..
          else
            echo "ℹ️ No KernelSU-side patch found, skipping"
          fi

      - name: Apply SuSFS kernel patch (4.14)
        working-directory: kernel_source
        run: |
          set +e
          P="$PWD/susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.14.patch"
          if [ -f "$P" ]; then
            patch -p1 --forward < "$P"
            RC=$?
            if [ $RC -ne 0 ]; then
              echo "::warning::Kernel patch had some rejects — see .rej files"
              find . -name "*.rej" -not -path "./susfs4ksu/*" | head -n 20
            else
              echo "✅ Kernel SuSFS patch applied cleanly"
            fi
          else
            echo "::error::50_add_susfs_in_kernel-4.14.patch not found"
            exit 1
          fi

          # تحقق نهائي
          test -f fs/susfs.c || { echo "::error::fs/susfs.c missing after patch"; exit 1; }
          test -f include/linux/susfs.h || { echo "::error::include/linux/susfs.h missing after patch"; exit 1; }
          echo "✅ SuSFS files in place"

      - name: Hook KernelSU into build system
        working-directory: kernel_source
        run: |
          set -e
          if ! grep -q "KernelSU" Makefile; then
            echo 'obj-$(CONFIG_KSU) += KernelSU/kernel/' >> Makefile
          fi

          # نضيف مصادر SuSFS في fs/Makefile (patches عادة تسويها، بس نتأكد)
          if ! grep -q "susfs" fs/Makefile; then
            echo 'obj-$(CONFIG_KSU_SUSFS) += susfs.o' >> fs/Makefile
          fi

          KCONFIG_MAIN=""
          for c in Kconfig Kconfig.ext; do
            [ -f "$c" ] && { KCONFIG_MAIN="$c"; break; }
          done
          test -n "$KCONFIG_MAIN" || { echo "::error::no root Kconfig"; exit 1; }

          if ! grep -q "KernelSU" "$KCONFIG_MAIN"; then
            printf '\nsource "KernelSU/kernel/Kconfig"\n' >> "$KCONFIG_MAIN"
          fi

          # نضيف Kconfig لـ SuSFS في fs/Kconfig
          if [ -f fs/Kconfig ] && ! grep -q "SUSFS" fs/Kconfig; then
            printf '\nsource "fs/susfs/Kconfig"\n' >> fs/Kconfig 2>/dev/null || true
          fi

          echo "✅ Build system hooked"

      - name: Enable KernelSU + SuSFS in defconfig
        working-directory: kernel_source
        run: |
          set -e
          DEFCONFIG=$(find arch/arm64/configs vendor -maxdepth 3 -name "*a51*defconfig" 2>/dev/null | head -n1)
          if [ -z "$DEFCONFIG" ]; then
            DEFCONFIG=$(find arch/arm64/configs vendor -maxdepth 3 \( -name "*exynos9611*" -o -name "*universal9611*" \) 2>/dev/null | head -n1)
          fi
          test -n "$DEFCONFIG" || { echo "::error::no defconfig"; exit 1; }
          echo "Using defconfig: $DEFCONFIG"

          sed -i '/^CONFIG_KSU=/d; /^# CONFIG_KSU is not set/d' "$DEFCONFIG"
          sed -i '/^CONFIG_KSU_SUSFS/d; /^# CONFIG_KSU_SUSFS/d' "$DEFCONFIG"

          cat >> "$DEFCONFIG" <<'EOF'

# KernelSU + SuSFS
CONFIG_KSU=y
CONFIG_KSU_SUSFS=y
# CONFIG_KSU_SUSFS_SUS_SU is not set
EOF

          echo "=== KernelSU/SuSFS lines in defconfig ==="
          grep -iE "ksu|susfs" "$DEFCONFIG"

      - name: Build kernel (target=a51)
        working-directory: kernel_source
        run: |
          python3 build_kernel.py --target=a51 --allow-dirty

      - name: Post-build verification
        if: success()
        working-directory: kernel_source
        run: |
          set +e
          echo "=== .config SuSFS entries ==="
          find out -name ".config" -exec grep -iE "KSU|SUSFS" {} \; | sort -u || true

          echo ""
          echo "=== susfs.o in build tree ==="
          find out -name "susfs.o" 2>/dev/null || echo "(susfs.o not found — check Kbuild)"
          find out -name "susfs.*" 2>/dev/null | head -n 20

          echo ""
          echo "=== Symbols in Image ==="
          IMG=$(find . -maxdepth 6 \( -name "Image" -o -name "Image.gz" -o -name "Image.gz-dtb" \) 2>/dev/null | head -n1)
          echo "Image: $IMG"
          if [ -n "$IMG" ]; then
            echo "---- susfs symbols ----"
            strings "$IMG" | grep -i susfs | head -n 30 || echo "(none)"
            echo "---- ksu symbols ----"
            strings "$IMG" | grep -i "kernelsu\|ksu_" | head -n 10 || echo "(none)"
          fi

          echo ""
          echo "=== .rej files remaining ==="
          find . -name "*.rej" -not -path "./susfs4ksu/*" -not -path "./toolchain/*" | head -n 30 || true

      - name: Locate built artifacts
        if: always()
        working-directory: kernel_source
        run: |
          find . -maxdepth 6 \( -name "*.zip" -o -name "Image" -o -name "Image.gz" -o -name "Image.gz-dtb" -o -name "boot.img" \) -print 2>/dev/null || true

      - name: Upload kernel zip
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-a51-${{ github.run_number }}
          path: |
            kernel_source/*.zip
            kernel_source/out/**/*.zip
            kernel_source/AnyKernel3/*.zip
            kernel_source/arch/arm64/boot/Image*
          if-no-files-found: warn

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: |
            kernel_source/*.log
            kernel_source/out/**/*.log
            kernel_source/**/*.rej
          if-no-files-found: ignore
