name: Build A51 Kernel with KernelSU Next + SuSFS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: 'mlm-studios/kernel_samsung_exynos_9611'
          ref: 'topser_cat_SN_A15'
          path: 'kernel_source'

      - name: Install dependencies
        run: |
          sudo apt -y update
          sudo apt -y install bison flex libssl-dev python3 python-is-python3 bc

      - name: Download Clang
        run: |
          wget https://github.com/XSans0/WeebX-Clang/releases/download/WeebX-Clang-19.1.5-release/WeebX-Clang-19.1.5.tar.gz -O "weebx-clang.tar.gz"
          rm -rf toolchain && mkdir toolchain && tar -xvf weebx-clang.tar.gz -C toolchain && rm -rf weebx-clang.tar.gz

      - name: Initialize KernelSU Next with SuSFS
        run: |
          cd kernel_source
          # تثبيت KernelSU-Non-GKI أولاً
          curl -LSs "https://raw.githubusercontent.com/mlm-games/KernelSU-Non-GKI/main/kernel/setup-subm.sh" | bash -s
          python3 KernelSU/scripts/integrate-no-kprobe.py --no-defconfig-flag
          curl -LSs "https://raw.githubusercontent.com/mlm-games/KernelSU-Non-GKI/main/kernel/setup-subm.sh" | bash -s -- --cleanup
          # محاولة تطبيق SuSFS لنواة 4.14
          curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" | bash -s next-susfs || echo "تخطي SuSFS"

      - name: Build Kernel
        run: |
          cd kernel_source
          python3 build_kernel.py --target=a51 --allow-dirty

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ github.run_number }}
          path: kernel_source/*.zip
